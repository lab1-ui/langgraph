<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소수 판별기</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --card: #ffffff;
        --accent: #4f46e5;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      main {
        width: min(520px, 100%);
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(79, 70, 229, 0.4);
        border-color: var(--accent);
      }

      button {
        width: 100%;
        margin-top: 16px;
        padding: 14px 16px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result {
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        background: #eef2ff;
        color: #3730a3;
        font-weight: 600;
        min-height: 52px;
        display: flex;
        align-items: center;
      }

      .hint {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>소수 판별기</h1>
      <p>자연수를 입력하면 소수인지 빠르게 알려드립니다.</p>

      <label for="numberInput">자연수 입력</label>
      <input
        id="numberInput"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
        placeholder="예: 17"
      />
      <button id="checkButton">판정하기</button>

      <div class="result" id="result">숫자를 입력한 뒤 판정하기를 눌러주세요.</div>
      <div class="hint">참고: 1은 소수가 아니며, 2와 3은 소수입니다.</div>
    </main>

    <script>
      const numberInput = document.getElementById("numberInput");
      const checkButton = document.getElementById("checkButton");
      const result = document.getElementById("result");

      const isPrime = (value) => {
        if (value < 2) {
          return false;
        }
        if (value === 2) {
          return true;
        }
        if (value % 2 === 0) {
          return false;
        }
        const limit = Math.floor(Math.sqrt(value));
        for (let i = 3; i <= limit; i += 2) {
          if (value % i === 0) {
            return false;
          }
        }
        return true;
      };

      const formatNumber = (value) => new Intl.NumberFormat("ko-KR").format(value);

      const updateResult = () => {
        const value = Number(numberInput.value);

        if (!Number.isInteger(value) || value < 1) {
          result.textContent = "1 이상의 자연수를 입력해주세요.";
          return;
        }

        const prime = isPrime(value);
        result.textContent = prime
          ? `${formatNumber(value)}는(은) 소수입니다.`
          : `${formatNumber(value)}는(은) 소수가 아닙니다.`;
      };

      checkButton.addEventListener("click", updateResult);
      numberInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          updateResult();
        }
      });
    </script>
  </body>
</html>
